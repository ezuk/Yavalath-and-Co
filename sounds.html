<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stone sound audition</title>
<style>
  body { margin: 0; padding: 24px 20px 40px; background: #0d171b; color: #f3ead9; font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  p { color: #9db0ad; margin: 0 0 20px; }
  button { display: flex; align-items: baseline; gap: 14px; width: 100%; min-height: 64px; margin-bottom: 12px; padding: 0 18px;
    border: 1px solid rgba(243, 234, 217, 0.15); border-radius: 14px; background: #14242a; color: inherit; font: inherit; text-align: left; }
  button:active { background: #1d333a; }
  button b { font-size: 26px; color: #e6b45c; min-width: 1em; }
</style>
</head>
<body>
<main>
  <h1>Stone sound audition</h1>
  <p>Tap to hear each one. Make sure the phone is not on silent. Tell Claude the number you want.</p>
  <div id="list"></div>
</main>
<script type="module">
  import { PRESETS, playClick } from './js/sound.js';
  PRESETS.forEach((preset, k) => {
    const b = document.createElement('button');
    b.innerHTML = `<b>${k}</b><span></span>`;
    b.querySelector('span').textContent = preset.name + (k === 0 ? ' (in the game now)' : '');
    b.addEventListener('click', () => playClick(0, k));
    document.getElementById('list').append(b);
  });
</script>
</body>
</html>
